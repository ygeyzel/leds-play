[project]
name = "leds-play"
version = "0.1.0"
description = "A multi-game platform for an LED-matrix display with physical button controls."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "Pillow",
    "pygame",
]

[project.optional-dependencies]
# Real-hardware (Raspberry Pi) backend only; not needed for `sim` mode.
rpi = [
    "rpi-ws281x",
    "lgpio",
    "pyserial",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 135

[tool.ruff.lint]
# Pyflakes + pycodestyle errors + import sorting. Deliberately narrower than
# ruff's defaults, which flag the py3.9-era typing style this code is written
# in (see requires-python above).
select = ["E", "F", "I"]
